name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create . --platforms=android
      - name: Fix SDK 35
        run: |
          sed -i 's/flutter.compileSdkVersion/35/g' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/35/g' android/app/build.gradle
      - run: cp lib/main.dart /tmp/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: wiz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
